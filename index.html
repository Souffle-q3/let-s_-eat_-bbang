  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fef6fb;
      --panel:     #ffffff;
      --border:    #f0d9ee;
      --shadow:    rgba(220,160,210,0.18);
      --text:      #4a3550;
      --muted:     #b89ec4;
      --accent:    #e879b0;
      --accent2:   #a78bfa;
      --cloud:     #fdf2f8;
      --c-sports:   #60a5fa;
      --c-idol-off: #f472b6;
      --c-idol-bday:#a78bfa;
      --c-beauty:   #34d399;
      --c-luxury:   #fbbf24;
      --c-small:    #fb923c;
      --c-food:     #f87171;
    }

    html, body { height: 100%; font-family: 'Nanum Gothic', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    body::before, body::after { content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    body::before { width: 360px; height: 360px; background: radial-gradient(circle, #fce7f3 0%, transparent 65%); top: -100px; left: -100px; }
    body::after  { width: 280px; height: 280px; background: radial-gradient(circle, #ede9fe 0%, transparent 65%); bottom: -70px; right: 360px; }

    #app { display: flex; height: 100vh; width: 100vw; position: relative; z-index: 1; }

    #sidebar { width: 380px; min-width: 320px; display: flex; flex-direction: column; background: var(--panel); border-right: 2.5px solid var(--border); box-shadow: 4px 0 28px var(--shadow); z-index: 10; overflow: hidden; }

    #sidebar-header { padding: 18px 20px 14px; background: linear-gradient(135deg, #fdf2f8 0%, #ede9fe 100%); border-bottom: 2px solid var(--border); position: relative; overflow: hidden; flex-shrink: 0; }
    #sidebar-header::before { content: '✿'; position: absolute; right: 14px; top: 8px; font-size: 3.2rem; opacity: 0.1; transform: rotate(18deg); }

    .logo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .logo-emoji { font-size: 1.55rem; }
    .logo-text { font-family: 'Gaegu', cursive; font-size: 1.65rem; font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: 1px; }
    .logo-badge { background: var(--accent); color: #fff; font-size: 0.58rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-top: 4px; }
    .tagline { font-size: 0.73rem; color: var(--muted); }

    #filter-section { padding: 12px 16px 10px; border-bottom: 2px solid var(--border); background: #fffbfe; flex-shrink: 0; }
    .filter-label { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px; display: flex; align-items: center; gap: 4px; }

    #category-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 11px; }

    .cat-chip { display: flex; align-items: center; gap: 3px; padding: 4px 10px; border-radius: 999px; border: 2px solid var(--border); font-size: 0.74rem; font-weight: 700; cursor: pointer; transition: all 0.18s; background: var(--cloud); color: var(--text); user-select: none; white-space: nowrap; }
    .cat-chip:hover { transform: translateY(-1px); box-shadow: 0 3px 10px var(--shadow); }
    .cat-chip.selected { color: #fff; transform: translateY(-1px); box-shadow: 0 4px 14px var(--shadow); }

    .cat-chip[data-cat="sports"]    { border-color: var(--c-sports); }
    .cat-chip[data-cat="idol_off"]  { border-color: var(--c-idol-off); }
