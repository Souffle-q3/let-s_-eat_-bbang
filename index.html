<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 카카오맵 장소 검색</title>
    <style>
        /* CSS: 디자인 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .main-container {
            display: flex; /* 화면을 가로로 분할 */
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .search-section h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }

        #keyword {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #search-btn {
            padding: 10px 15px;
            background-color: #ffeb00; /* 카카오 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #search-btn:hover {
            background-color: #fada00;
        }

        /* 검색 결과 리스트 영역 */
        #result-list {
            flex: 1;
            overflow-y: auto; /* 리스트가 길어지면 스크롤 생성 */
            list-style: none;
        }

        .result-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background: white;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .result-item:hover {
            background-color: #f0f0f0;
        }

        .place-title {
            font-weight: bold;
            display: block;
            color: #007bff;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <div class="search-section">
                <h2>📍 장소 검색하기</h2>
                <div class="input-group">
                    <input type="text" id="keyword" placeholder="장소를 입력하세요 (예: 강남역)">
                    <button id="search-btn">검색</button>
                </div>
            </div>
            <ul id="result-list">
                </ul>
        </div>

        <div id="map"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2a64c1f27d4a92a081f70af6667a6ccb&libraries=services"></script>

    <script>
        /** JS: 동작 설정 **/
        let map;
        let ps; // 장소 검색 서비스 객체
        let infowindow; // 정보를 보여줄 창

        // 페이지 로드 시 실행되는 초기화 함수
        function init() {
            const mapContainer = document.getElementById('map');
            const mapOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 위치 (서울시청)
                level: 5 // 지도의 확대 레벨
            };

            // 1. 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOption);
            
            // 2. 장소 검색 서비스 객체 생성
            ps = new kakao.maps.services.Places();
            
            // 3. 인포윈도우 객체 생성 (마커 클릭 시 이름 표시용)
            infowindow = new kakao.maps.InfoWindow({zIndex:1});

            // 4. 현재 위치 가져오기 (Geolocation)
            getCurrentLocation();

            // 5. 검색 버튼 이벤트 연결
            document.getElementById('search-btn').addEventListener('click', searchPlaces);
            document.getElementById('keyword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchPlaces();
            });
        }

        // 브라우저의 GPS 기능을 이용해 현재 위치를 찾는 함수
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude; // 위도
                    const lon = position.coords.longitude; // 경도
                    
                    const locPosition = new kakao.maps.LatLng(lat, lon);
                    
                    // 지도의 중심을 내 위치로 이동
                    map.setCenter(locPosition);
                    displayMarker(locPosition, "내 위치");
                });
            } else {
                alert("이 브라우저에서는 위치 기반 서비스를 사용할 수 없습니다.");
            }
        }

        // 키워드 검색 처리 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return;
            }

            // 카카오 API 검색 서비스 실행
            ps.keywordSearch(keyword, placesSearchCB);
        }

        // 검색 완료 시 호출되는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과를 화면에 표시하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('result-list');
            const bounds = new kakao.maps.LatLngBounds();
            
            // 기존 결과 제거
            listEl.innerHTML = "";

            for (let i = 0; i < places.length; i++) {
                const placePosition
