<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오맵 장소 검색</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* 왼쪽 검색 패널 */
    .sidebar {
      width: 35%;
      min-width: 320px;
      background-color: #ffffff;
      border-right: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .search-box button {
      padding: 10px 16px;
      border: none;
      background-color: #f7e600;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-box button:hover {
      background-color: #ffe100;
    }

    /* 검색 결과 리스트 */
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-item {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .result-item:hover {
      background-color: #f5f5f5;
    }

    .place-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .place-address {
      font-size: 14px;
      color: #555;
    }

    /* 오른쪽 지도 영역 */
    .map-area {
      flex: 1;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45%;
      }

      .map-area {
        height: 55%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 검색 영역 -->
    <div class="sidebar">
      <h1>장소 검색</h1>

      <div class="search-box">
        <input
          type="text"
          id="keyword"
          placeholder="검색어를 입력하세요"
        />
        <button onclick="searchPlace()">검색</button>
      </div>

      <div id="resultList" class="result-list"></div>
    </div>

    <!-- 오른쪽 지도 영역 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <!-- 카카오맵 SDK -->
  <!-- https 프로토콜 명시 -->
  <!-- autoload=false 사용 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2a64c1f27d4a92a081f70af6667a6ccb&libraries=services&autoload=false">
  </script>

  <script>

    let map;
    let placesService;
    let markers = [];

    // 지도 생성 함수
    function createMap(latitude, longitude) {

      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: new kakao.maps.LatLng(latitude, longitude),
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOption);

      // 현재 위치 좌표
      const currentPosition = new kakao.maps.LatLng(latitude, longitude);

      // 현재 위치 마커
      const currentMarker = new kakao.maps.Marker({
        position: currentPosition,
        map: map
      });

      // 현재 위치 인포윈도우
      const currentInfoWindow = new kakao.maps.InfoWindow({
        content: `
          <div style="padding:6px; font-size:13px;">
            현재 위치
          </div>
        `
      });

      currentInfoWindow.open(map, currentMarker);

      // 장소 검색 서비스 객체 생성
      placesService = new kakao.maps.services.Places();
    }

    // 장소 검색 함수
    function searchPlace() {

      const keywordInput = document.getElementById("keyword");
      const keyword = keywordInput.value.trim();

      // 검색어 예외 처리
      if (!keyword) {
        alert("검색어를 입력해주세요.");
        return;
      }

      // 키워드 검색 실행
      placesService.keywordSearch(
        keyword,
        placeSearchCallback,
        {
          location: map.getCenter()
        }
      );
    }

    // 검색 결과 처리 함수
    function placeSearchCallback(data, status) {

      const resultList = document.getElementById("resultList");

      // 기존 검색 결과 제거
      resultList.innerHTML = "";

      // 기존 마커 제거
      removeMarkers();

      // 검색 성공
      if (status === kakao.maps.services.Status.OK) {

        // 지도 범위 객체 생성
        const bounds = new kakao.maps.LatLngBounds();

        data.forEach((place) => {

          const position = new kakao.maps.LatLng(place.y, place.x);

          // 검색 결과 마커 생성
          const marker = new kakao.maps.Marker({
            map: map,
            position: position
          });

          // 마커 배열 저장
          markers.push(marker);

          // 지도 범위 확장
          bounds.extend(position);

          // 검색 결과 아이템 생성
          const item = document.createElement("div");

          item.className = "result-item";

          item.innerHTML = `
            <div class="place-name">
              ${place.place_name}
            </div>

            <div class="place-address">
              ${place.road_address_name || place.address_name}
            </div>
          `;

          // 검색 결과 클릭 시 지도 이동
          item.addEventListener("click", () => {

            map.setCenter(position);

            const infoWindow = new kakao.maps.InfoWindow({
              content: `
                <div style="padding:6px; font-size:13px;">
                  ${place.place_name}
                </div>
              `
            });

            infoWindow.open(map, marker);
          });

          // 결과 리스트 추가
          resultList.appendChild(item);
        });

        // 검색 결과가 모두 보이도록 지도 범위 자동 조정
        map.setBounds(bounds);

      }

      // 검색 결과 없음
      else if (status === kakao.maps.services.Status.ZERO_RESULT) {

        alert("검색 결과가 없습니다.");
      }

      // API 오류
      else if (status === kakao.maps.services.Status.ERROR) {

        alert("장소 검색 중 오류가 발생했습니다.");
      }
    }

    // 기존 마커 제거 함수
    function removeMarkers() {

      markers.forEach((marker) => {
        marker.setMap(null);
      });

      markers = [];
    }

    // 현재 위치 가져오기 함수
    function getCurrentLocation() {

      // 브라우저 위치 기능 지원 여부 확인
      if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(

          // 위치 가져오기 성공
          (position) => {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            createMap(latitude, longitude);
          },

          // 위치 가져오기 실패
          () => {

            alert("위치 권한이 거부되었습니다.");

            // 기본 위치: 서울 시청
            createMap(37.5665, 126.9780);
          }

        );

      } else {

        alert("이 브라우저에서는 위치 기능을 지원하지 않습니다.");

        createMap(37.5665, 126.9780);
      }
    }

    // 지도 API 로딩 완료 후 실행
    kakao.maps.load(() => {

      getCurrentLocation();

    });

    // 엔터키 검색
    document.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        searchPlace();
      }

    });

  </script>

</body>
</html>
